<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Line Break Example</title>
</head>
<body>
    <h1>Two Sentences with a Line Break</h1>

    <!-- Two sentences separated by a <br> tag instead of a new paragraph -->
    <p>
        I love spending my weekends hiking in the mountains.<br>
        The fresh air and scenic views always help me relax.
    </p>
</body>
</html>
