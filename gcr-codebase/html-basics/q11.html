<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Span Elements Example</title>
</head>
<body>
    <h1>Labeled Text with Span</h1>

    <!-- Paragraph containing three span elements to label different parts of the text -->
    <p>
        My name is <span title="Full Name">Alex Morgan</span>, I am a
        <span title="Occupation">student</span>, and I live in
        <span title="Location">Uttar Pradesh, India</span>.
    </p>
</body>
</html>
