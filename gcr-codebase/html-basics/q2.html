<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hyperlink to Google</title>
</head>
<body>
    <h1>Useful Link</h1>

    <!-- Hyperlink to Google, opens in a new tab using target="_blank" -->
    <p>
        You can search anything you want using
        <a href="https://www.google.com" target="_blank">Google Search</a>.
    </p>
</body>
</html>
