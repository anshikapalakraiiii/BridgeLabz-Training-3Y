<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link rel="stylesheet" href="q8_dashboard.css">
</head>
<body>

  <header class="dash-header">
    <h1>My Dashboard</h1>
  </header>

  <div class="dash-layout">
    <aside class="sidebar">
      <nav>
        <ul>
          <li><a href="#">Overview</a></li>
          <li><a href="#">Analytics</a></li>
          <li><a href="#">Projects</a></li>
          <li><a href="#">Messages</a></li>
          <li><a href="#">Settings</a></li>
        </ul>
      </nav>
    </aside>

    <main class="content">
      <div class="content-box">
        <h2>Recent Activity</h2>
        <p>You have 3 new notifications and 2 pending tasks awaiting review.</p>
      </div>

      <div class="content-box">
        <h2>Performance</h2>
        <p>Traffic is up 12% compared to last week, with engagement steady
        across all channels.</p>
      </div>
    </main>
  </div>

</body>
</html>
