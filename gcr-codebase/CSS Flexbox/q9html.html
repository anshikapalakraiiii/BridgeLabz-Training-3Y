<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Flip</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage">
  <div class="card">
    <div class="card-inner">
      <div class="card-face card-front">
        <img src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?w=300&h=200&fit=crop" alt="Mountain lake">
        <h2>Silver Lake</h2>
      </div>
      <div class="card-face card-back">
        <p>A quiet alpine lake reached by a two-hour trail. Best visited at sunrise, when the water is completely still.</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
