<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Registration Form</title>
</head>
<body>

    <h1>Course Registration Form</h1>

    <form>

        <!-- Fieldset for Personal Details -->
        <fieldset>
            <legend>Personal Details</legend>

            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name"><br><br>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email"><br><br>
        </fieldset>

        <br>

        <!-- Fieldset for Course Selection -->
        <fieldset>
            <legend>Course Selection</legend>

            <label for="course">Select Course:</label>
            <select id="course" name="course">
                <option value="html">HTML &amp; CSS Basics</option>
                <option value="js">JavaScript Fundamentals</option>
                <option value="python">Python Programming</option>
                <option value="dbms">Database Management Systems</option>
            </select>
        </fieldset>

        <br>

        <input type="submit" value="Register">

    </form>

    <br>

    <!-- Table showing available course schedules -->
    <h2>Available Course Schedules</h2>
    <table border="1" cellpadding="6">
        <tr>
            <th>Day</th>
            <th>Time</th>
            <th>Instructor</th>
        </tr>
        <tr>
            <td>Monday</td>
            <td>10:00 AM - 11:30 AM</td>
            <td>Mr. Sharma</td>
        </tr>
        <tr>
            <td>Wednesday</td>
            <td>2:00 PM - 3:30 PM</td>
            <td>Ms. Verma</td>
        </tr>
        <tr>
            <td>Friday</td>
            <td>11:00 AM - 12:30 PM</td>
            <td>Mr. Sharma</td>
        </tr>
    </table>

</body>
</html>
