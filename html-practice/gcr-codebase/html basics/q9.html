<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Strong and Em Together</title>
</head>
<body>
    <h1>Emphasis in Text</h1>

    <!-- Paragraph using both <strong> and <em> for different parts -->
    <p>
        It is <strong>very important</strong> to practice HTML daily, and it can
        also be <em>quite enjoyable</em> once you get the hang of it.
    </p>
</body>
</html>
