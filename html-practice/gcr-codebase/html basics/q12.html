<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Creative Inline Formatting</title>
</head>
<body>
    <h1>Inline Elements Showcase</h1>

    <!-- Paragraph combining strong, em, mark, small, and br -->
    <p>
        <strong>Welcome to my page!</strong><br>
        I enjoy <em>learning web development</em> and consider
        <mark>HTML</mark> to be a great starting point.<br>
        <small>Last updated: this week</small>
    </p>
</body>
</html>
