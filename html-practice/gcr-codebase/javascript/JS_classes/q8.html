<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q8 – Dynamic Object Updater</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Edit User</h1>
    <form id="user-form">
      <div class="field"><label for="name">Name</label><input id="name" type="text" required></div>
      <div class="field"><label for="email">Email</label><input id="email" type="email" required></div>
      <div class="field"><label for="age">Age</label><input id="age" type="number" min="0" required></div>
      <button type="submit">Update</button>
    </form>
    <h3>Current user object</h3>
    <pre id="user-output"></pre>
    <div id="user-details"></div>
  </main>
  <script src="q8_object_updater.js"></script>
</body>
</html>
