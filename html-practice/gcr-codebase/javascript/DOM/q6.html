<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Q6 - Real-Time Table Filter</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f3f4f6; display: flex; justify-content: center; padding: 40px 16px; }
    .app { background: #fff; width: 100%; max-width: 560px; padding: 24px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    #search-box { width: 100%; padding: 10px; box-sizing: border-box; margin-bottom: 14px; border: 1px solid #ccc; border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; border-bottom: 1px solid #e5e7eb; text-align: left; }
    th { background: #1f2937; color: #fff; }
    #no-results td { text-align: center; color: #dc2626; font-weight: bold; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="app">
    <h1>Student Records</h1>
    <input type="text" id="search-box" placeholder="Search by name, branch or CGPA..." />
    <table>
      <thead>
        <tr><th>Name</th><th>Branch</th><th>CGPA</th></tr>
      </thead>
      <tbody id="student-table-body">
        <tr><td>Aarav Sharma</td><td>Computer Science</td><td>8.9</td></tr>
        <tr><td>Diya Verma</td><td>Electronics</td><td>9.2</td></tr>
        <tr><td>Rohan Gupta</td><td>Mechanical</td><td>7.8</td></tr>
        <tr><td>Sneha Iyer</td><td>Computer Science</td><td>9.5</td></tr>
        <tr><td>Kabir Singh</td><td>Civil</td><td>8.1</td></tr>
        <tr><td>Meera Nair</td><td>Information Technology</td><td>8.6</td></tr>
        <tr><td>Vikram Rao</td><td>Electrical</td><td>7.4</td></tr>
        <tr id="no-results" hidden><td colspan="3">No results found</td></tr>
      </tbody>
    </table>
  </div>
  <script src="q6_tableFilter.js"></script>
</body>
</html>
