<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Q4 - Theme Switcher</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; transition: background .3s, color .3s; }
    .card { padding: 32px; border-radius: 12px; text-align: center; max-width: 420px; transition: background .3s, color .3s; }
    button { margin: 4px; padding: 8px 18px; border: 2px solid transparent; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    button[aria-pressed="true"] { border-color: currentColor; font-weight: bold; }

    /* Each theme is applied by a class on <body> (set via setAttribute) */
    body.theme-light { background: #f9fafb; color: #111827; }
    body.theme-light .card { background: #ffffff; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
    body.theme-light button { background: #e5e7eb; color: #111827; }

    body.theme-dark { background: #111827; color: #f9fafb; }
    body.theme-dark .card { background: #1f2937; }
    body.theme-dark button { background: #374151; color: #f9fafb; }

    body.theme-blue { background: #dbeafe; color: #1e3a8a; }
    body.theme-blue .card { background: #bfdbfe; }
    body.theme-blue button { background: #2563eb; color: #ffffff; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Theme Switcher</h1>
    <p>Current theme: <strong id="theme-label"></strong></p>
    <p>data-theme on &lt;body&gt;: <code id="attribute-label"></code></p>
    <div>
      <button data-theme-value="light">Light</button>
      <button data-theme-value="dark">Dark</button>
      <button data-theme-value="blue">Blue</button>
    </div>
  </div>
  <script src="q4_themeSwitcher.js"></script>
</body>
</html>
