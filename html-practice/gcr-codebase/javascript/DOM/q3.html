<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Q3 - Multi-Step Form</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f3f4f6; display: flex; justify-content: center; padding: 40px 16px; }
    .app { background: #fff; width: 100%; max-width: 420px; padding: 24px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    #progress { color: #6b7280; font-size: .9rem; margin-bottom: 12px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; }
    input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
    .error { color: #dc2626; font-size: .85rem; min-height: 1.2em; margin: 6px 0 0; }
    .buttons { display: flex; justify-content: space-between; margin-top: 16px; }
    button { padding: 8px 18px; border: none; border-radius: 6px; cursor: pointer; color: #fff; background: #2563eb; }
    #back-button { background: #6b7280; }
    [hidden] { display: none !important; }
    #summary dt { font-weight: bold; margin-top: 8px; }
    #summary dd { margin: 2px 0 0; }
  </style>
</head>
<body>
  <div class="app">
    <h1>Sign Up</h1>
    <p id="progress"></p>

    <form id="multi-step-form" novalidate>
      <div class="step">
        <label for="name-input">Step 1: Name</label>
        <input type="text" id="name-input" placeholder="Your full name" />
        <p class="error"></p>
      </div>
      <div class="step" hidden>
        <label for="email-input">Step 2: Email</label>
        <input type="email" id="email-input" placeholder="you@example.com" />
        <p class="error"></p>
      </div>
      <div class="step" hidden>
        <label for="password-input">Step 3: Password</label>
        <input type="password" id="password-input" placeholder="At least 6 characters" />
        <p class="error"></p>
      </div>

      <div class="buttons">
        <button type="button" id="back-button">Back</button>
        <button type="button" id="next-button">Next</button>
      </div>
    </form>

    <section id="summary" hidden>
      <h2>Summary</h2>
      <dl>
        <dt>Name</dt><dd id="summary-name"></dd>
        <dt>Email</dt><dd id="summary-email"></dd>
        <dt>Password</dt><dd id="summary-password"></dd>
      </dl>
      <button type="button" id="restart-button">Start over</button>
    </section>
  </div>
  <script src="q3_multiStepForm.js"></script>
</body>
</html>
