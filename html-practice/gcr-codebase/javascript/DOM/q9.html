<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Q9 - Form Submit Blocker</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f3f4f6; display: flex; justify-content: center; padding: 40px 16px; }
    .app { background: #fff; width: 100%; max-width: 400px; padding: 24px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .field { margin-bottom: 14px; }
    label { display: block; font-weight: bold; margin-bottom: 6px; }
    input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
    input.invalid { border-color: #dc2626; }
    .error { color: #dc2626; font-size: .85rem; min-height: 1.1em; margin: 4px 0 0; }
    button { padding: 10px 20px; border: none; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
    #success-message { margin-top: 14px; padding: 10px; background: #dcfce7; color: #166534; border-radius: 6px; font-weight: bold; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="app">
    <h1>Register</h1>
    <form id="register-form" novalidate>
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" />
        <p class="error" id="name-error"></p>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="text" id="email" name="email" />
        <p class="error" id="email-error"></p>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" />
        <p class="error" id="password-error"></p>
      </div>
      <button type="submit">Submit</button>
    </form>
    <p id="success-message" hidden>Form Submitted Successfully</p>
  </div>
  <script src="q9_formValidation.js"></script>
</body>
</html>
