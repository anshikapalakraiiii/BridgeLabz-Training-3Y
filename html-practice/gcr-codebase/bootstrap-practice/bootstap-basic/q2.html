<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asha Verma | Portfolio</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-light text-dark">

<header class="text-center py-5 bg-white">
  <div class="container">
    <!-- rounded-circle + img-fluid for a responsive circular profile photo -->
    <img src="https://placehold.co/150x150" class="img-fluid rounded-circle mb-3" alt="Profile photo of Asha Verma">
    <h1 class="fw-bold">Asha Verma</h1>
    <p class="lead">Frontend Developer &amp; UI Enthusiast</p>
  </div>
</header>

<main class="container text-center">

  <!-- Spacing utilities: mt-4, mb-3, p-5 -->
  <section class="p-5 mt-4 mb-3 bg-white rounded shadow-sm">
    <h2 class="fw-bold mb-3">About Me</h2>
    <p>I build clean, responsive web experiences using modern tools like Bootstrap and React.
       I love turning ideas into pixel-perfect interfaces.</p>

    <div class="mt-4">
      <a href="#" class="btn btn-primary btn-lg me-2">Hire Me</a>
      <a href="#" class="btn btn-outline-secondary btn-lg">Download CV</a>
    </div>
  </section>

  <!-- Contact form -->
  <section class="p-5 mt-4 mb-3 bg-white rounded shadow-sm text-start">
    <h2 class="fw-bold text-center mb-4">Get In Touch</h2>
    <form>
      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" class="form-control" id="name" placeholder="Your name">
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" placeholder="you@example.com">
      </div>
      <div class="mb-3">
        <label for="message" class="form-label">Message</label>
        <textarea class="form-control" id="message" rows="3" placeholder="Say hello..."></textarea>
      </div>
      <div class="text-center">
        <button type="submit" class="btn btn-primary px-4">Send Message</button>
      </div>
    </form>
  </section>

</main>

<footer class="text-center py-4 mt-4 bg-dark text-white">
  <p class="mb-0">&copy; 2026 Asha Verma</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
