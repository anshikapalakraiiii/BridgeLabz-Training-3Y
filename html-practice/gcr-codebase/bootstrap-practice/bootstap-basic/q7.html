<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Tracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<header class="bg-dark text-white py-3">
  <div class="container d-flex justify-content-between align-items-center">
    <h1 class="fw-bold m-0">My Tasks</h1>
    <!-- Badge counter showing pending tasks -->
    <span class="badge bg-warning text-dark fs-6">4 Pending</span>
  </div>
</header>

<main class="container my-5">
  <ul class="list-group shadow-sm">

    <li class="list-group-item d-flex justify-content-between align-items-center">
      Finish Bootstrap assignment
      <span class="badge bg-danger rounded-pill">High</span>
    </li>

    <li class="list-group-item d-flex justify-content-between align-items-center">
      Reply to client email
      <span class="badge bg-warning text-dark rounded-pill">Medium</span>
    </li>

    <li class="list-group-item d-flex justify-content-between align-items-center">
      Water the plants
      <span class="badge bg-success rounded-pill">Low</span>
    </li>

    <li class="list-group-item d-flex justify-content-between align-items-center">
      Prepare weekly report
      <span class="badge bg-danger rounded-pill">High</span>
    </li>

    <li class="list-group-item d-flex justify-content-between align-items-center text-decoration-line-through text-muted">
      Update project README
      <span class="badge bg-secondary rounded-pill">Done</span>
    </li>

  </ul>

  <div class="text-center mt-4">
    <!-- Button with embedded badge -->
    <button class="btn btn-success">
      Completed <span class="badge bg-light text-success ms-1">1</span>
    </button>
  </div>
</main>

<footer class="text-center py-3 bg-dark text-white">
  <p class="mb-0">&copy; 2026 Task Tracker App</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
