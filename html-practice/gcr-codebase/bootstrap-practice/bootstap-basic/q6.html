<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<header class="bg-dark text-white text-center py-3">
  <h1 class="fw-bold m-0">Notifications</h1>
</header>

<main class="container my-5">
  <div class="card shadow-sm">
    <div class="card-body">

      <!-- Contextual alerts -->
      <div class="alert alert-success" role="alert">
        <strong>New message</strong> received from Priya Sharma.
      </div>

      <div class="alert alert-info" role="alert">
        <strong>Tip:</strong> You can pin important notifications for quick access.
      </div>

      <!-- Dismissible alert -->
      <div class="alert alert-danger alert-dismissible fade show" role="alert">
        <strong>Warning:</strong> Your storage is 90% full.
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>

      <!-- "Well" style summary panel -->
      <div class="bg-light border rounded p-4 mt-4">
        <h5 class="fw-bold">Summary</h5>
        <p class="mb-0">You have <strong>3</strong> unread notifications and <strong>1</strong> action item requiring attention today.</p>
      </div>

    </div>
  </div>
</main>

<footer class="text-center py-3 bg-dark text-white">
  <p class="mb-0">&copy; 2026 Dashboard App</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
