<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UrbanCart | Product Catalog</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="bg-dark text-white text-center py-4">
  <h1 class="fw-bold m-0">UrbanCart</h1>
  <p class="mb-0">Everyday essentials, delivered fast</p>
</header>

<main class="container my-5">
  <h2 class="text-center mb-4">Our Products</h2>

  <!--
    Responsive grid:
    col-12  -> 1 column on mobile
    col-md-6 not used here directly; col-md-3 gives 4 columns on md+ screens
    On tablets (sm) we show 2 columns via col-6, and 1 column on mobile via col-12
  -->
  <div class="row g-4">

    <div class="col-12 col-sm-6 col-md-3">
      <div class="card h-100 shadow-sm product-card">
        <img src="https://placehold.co/300x200" class="card-img-top" alt="Wireless headphones">
        <div class="card-body text-center">
          <h5 class="card-title">Wireless Headphones</h5>
          <p class="card-text fw-bold">$49.99</p>
          <button class="btn btn-primary w-100">Add to Cart</button>
        </div>
      </div>
    </div>

    <div class="col-12 col-sm-6 col-md-3">
      <div class="card h-100 shadow-sm product-card">
        <img src="https://placehold.co/300x200" class="card-img-top" alt="Smart watch">
        <div class="card-body text-center">
          <h5 class="card-title">Smart Watch</h5>
          <p class="card-text fw-bold">$89.99</p>
          <button class="btn btn-primary w-100">Add to Cart</button>
        </div>
      </div>
    </div>

    <div class="col-12 col-sm-6 col-md-3">
      <div class="card h-100 shadow-sm product-card">
        <img src="https://placehold.co/300x200" class="card-img-top" alt="Backpack">
        <div class="card-body text-center">
          <h5 class="card-title">Travel Backpack</h5>
          <p class="card-text fw-bold">$34.99</p>
          <button class="btn btn-primary w-100">Add to Cart</button>
        </div>
      </div>
    </div>

    <div class="col-12 col-sm-6 col-md-3">
      <div class="card h-100 shadow-sm product-card">
        <img src="https://placehold.co/300x200" class="card-img-top" alt="Desk lamp">
        <div class="card-body text-center">
          <h5 class="card-title">LED Desk Lamp</h5>
          <p class="card-text fw-bold">$19.99</p>
          <button class="btn btn-primary w-100">Add to Cart</button>
        </div>
      </div>
    </div>

  </div>
</main>

<footer class="bg-dark text-white text-center py-3">
  <p class="mb-0">&copy; 2026 UrbanCart</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
