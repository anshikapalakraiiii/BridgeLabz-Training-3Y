<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shadows &amp; Depth Effect Layout</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="page-header">
    <h1 class="heading-shadow">Shadows &amp; Depth</h1>
    <p>Three cards, three shadow treatments. Hover to lift each one.</p>
  </header>

  <main class="card-row">
    <article class="card card--soft">
      <h2 class="heading-shadow">Soft Shadow</h2>
      <p>A gentle, diffused shadow that sits close to the card.</p>
    </article>

    <article class="card card--sharp">
      <h2 class="heading-shadow">Sharp Shadow</h2>
      <p>A tighter, higher-contrast shadow with less blur.</p>
    </article>

    <article class="card card--layered">
      <h2 class="heading-shadow">Layered Shadow</h2>
      <p>Multiple stacked shadows to suggest greater elevation.</p>
    </article>
  </main>
</body>
</html>
