<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Transformations Showcase</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="page-header">
    <h1>CSS Transformations</h1>
    <p>Hover over each box to see its transform applied.</p>
  </header>

  <main class="transform-row">
    <figure class="transform-box-wrap">
      <div class="transform-box transform-box--rotate">rotate()</div>
      <figcaption>Rotates 45 degrees on hover</figcaption>
    </figure>

    <figure class="transform-box-wrap">
      <div class="transform-box transform-box--scale">scale()</div>
      <figcaption>Scales up to 1.3x on hover</figcaption>
    </figure>

    <figure class="transform-box-wrap">
      <div class="transform-box transform-box--translate">translate()</div>
      <figcaption>Shifts position on hover</figcaption>
    </figure>

    <figure class="transform-box-wrap">
      <div class="transform-box transform-box--skew">skew()</div>
      <figcaption>Skews along the X axis on hover</figcaption>
    </figure>
  </main>
</body>
</html>
