<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSS Animation Demonstration</title>
<link rel="stylesheet" href="q6_animations.css">
</head>
<body>
  <header>
    <h1>CSS Animation Playground</h1>
  </header>

  <main class="stage">

    <div class="anim-group">
      <div class="moving-box"></div>
      <p>Moving Box</p>
    </div>

    <div class="anim-group">
      <div class="ball-track">
        <div class="bouncing-ball"></div>
      </div>
      <p>Bouncing Ball</p>
    </div>

    <div class="anim-group">
      <p class="color-text">Color Changing Text</p>
      <p>Text Color Cycle</p>
    </div>

  </main>

  <footer>
    <p>Assignment 8 &mdash; Question 6</p>
  </footer>
</body>
</html>
