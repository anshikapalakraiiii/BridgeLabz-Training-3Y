<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSS Tooltip Demonstration</title>
<link rel="stylesheet" href="q2_tooltip.css">
</head>
<body>
  <header>
    <h1>Pure CSS Tooltips</h1>
    <p>Hover over any item below to reveal its tooltip.</p>
  </header>

  <main>
    <section class="tooltip-stage">

      <span class="tooltip-item">
        &#9733; Star
        <span class="tooltip-text">This is a favorite item</span>
      </span>

      <span class="tooltip-item">
        &#128231; Message
        <span class="tooltip-text">You have new messages</span>
      </span>

      <span class="tooltip-item">
        &#9881; Settings
        <span class="tooltip-text">Adjust your preferences</span>
      </span>

      <span class="tooltip-item">
        &#128274; Lock
        <span class="tooltip-text">Account is secured</span>
      </span>

      <span class="tooltip-item">
        Help
        <span class="tooltip-text">Click for support docs</span>
      </span>

    </section>
  </main>

  <footer>
    <p>Assignment 8 &mdash; Question 2</p>
  </footer>
</body>
</html>
