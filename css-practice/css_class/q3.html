<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image Showcase</title>
<link rel="stylesheet" href="q3_image_showcase.css">
</head>
<body>
  <header>
    <h1>Gallery Showcase</h1>
    <p>Hover over an image to see it scale and darken.</p>
  </header>

  <main>
    <section class="gallery">

      <figure class="gallery-item">
        <div class="img-wrap">
          <img src="https://picsum.photos/id/1015/400/300" alt="Mountain river">
          <div class="overlay"></div>
        </div>
        <figcaption>Mountain River</figcaption>
      </figure>

      <figure class="gallery-item">
        <div class="img-wrap">
          <img src="https://picsum.photos/id/1025/400/300" alt="Dog portrait">
          <div class="overlay"></div>
        </div>
        <figcaption>Puppy Portrait</figcaption>
      </figure>

      <figure class="gallery-item">
        <div class="img-wrap">
          <img src="https://picsum.photos/id/1035/400/300" alt="Forest road">
          <div class="overlay"></div>
        </div>
        <figcaption>Forest Road</figcaption>
      </figure>

      <figure class="gallery-item">
        <div class="img-wrap">
          <img src="https://picsum.photos/id/1043/400/300" alt="Coastline">
          <div class="overlay"></div>
        </div>
        <figcaption>Coastline View</figcaption>
      </figure>

      <figure class="gallery-item">
        <div class="img-wrap">
          <img src="https://picsum.photos/id/1050/400/300" alt="City street">
          <div class="overlay"></div>
        </div>
        <figcaption>City Street</figcaption>
      </figure>

      <figure class="gallery-item">
        <div class="img-wrap">
          <img src="https://picsum.photos/id/1069/400/300" alt="Desert dunes">
          <div class="overlay"></div>
        </div>
        <figcaption>Desert Dunes</figcaption>
      </figure>

    </section>
  </main>

  <footer>
    <p>Assignment 8 &mdash; Question 3</p>
  </footer>
</body>
</html>
