<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="dashboard">
  <header class="dash-header">
    <h1>Analytics</h1>
  </header>

  <aside class="sidebar">
    <nav>
      <a href="#">Overview</a>
      <a href="#">Traffic</a>
      <a href="#">Revenue</a>
      <a href="#">Reports</a>
      <a href="#">Settings</a>
    </nav>
  </aside>

  <main class="main-grid">
    <div class="box wide">
      <h2>Weekly Traffic</h2>
      <p>12,480 visits, up 8% from last week.</p>
    </div>
    <div class="box">
      <h2>Revenue</h2>
      <p>₹3,42,000 this month.</p>
    </div>
    <div class="box">
      <h2>New Signups</h2>
      <p>214 new accounts today.</p>
    </div>
    <div class="box">
      <h2>Support Tickets</h2>
      <p>6 open, 2 flagged urgent.</p>
    </div>
  </main>
</div>
</body>
</html>
