<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pricing</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section class="pricing">
  <div class="plan">
    <h2>Starter</h2>
    <p class="price">₹499<span>/mo</span></p>
    <ul>
      <li>1 project</li>
      <li>Email support</li>
      <li>2GB storage</li>
    </ul>
  </div>

  <div class="plan featured">
    <h2>Studio</h2>
    <p class="price">₹1,299<span>/mo</span></p>
    <ul>
      <li>10 projects</li>
      <li>Priority support</li>
      <li>50GB storage</li>
      <li>Team collaboration</li>
    </ul>
  </div>

  <div class="plan">
    <h2>Enterprise</h2>
    <p class="price">₹3,499<span>/mo</span></p>
    <ul>
      <li>Unlimited projects</li>
      <li>Dedicated support</li>
      <li>500GB storage</li>
    </ul>
  </div>
</section>
</body>
</html>
